name: Build Hardik Buds Pro Debug APK

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit and Robolectric tests before assembling APK"
        required: false
        default: true
        type: boolean
      is_prerelease:
        description: "Mark published tag release as Beta/Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build HARDIK BUDS PRO (ULTRA PREMIUM) Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Accept Android SDK licenses for AGP auto-download
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh Android debug keystore..."
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Run unit & Robolectric tests
        if: ${{ github.event_name == 'push' || inputs.run_tests != false }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK, sign check & generate metadata
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          RAW_APK="${APK_DIR}/app-debug.apk"
          NAMED_APK="${APK_DIR}/Hardik-Buds-Pro-Ultra-Premium-debug.apk"

          if [ ! -s "$RAW_APK" ]; then
            echo "::error::Expected Debug APK not found at $RAW_APK"
            exit 1
          fi

          cp "$RAW_APK" "$NAMED_APK"
          sha256sum "$NAMED_APK" > "${NAMED_APK}.sha256"

          APK_SIZE=$(du -h "$NAMED_APK" | cut -f1)
          APK_SHA=$(cut -d ' ' -f1 "${NAMED_APK}.sha256")

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$NAMED_APK"
          fi

          {
            echo "## HARDIK BUDS PRO — ULTRA PREMIUM Debug APK"
            echo ""
            echo "- **Repository:** \`${{ github.repository }}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **APK File:** \`Hardik-Buds-Pro-Ultra-Premium-debug.apk\`"
            echo "- **APK Size:** \`${APK_SIZE}\`"
            echo "- **SHA-256:** \`${APK_SHA}\`"
            echo "- **Artifact:** Download \`Hardik-Buds-Pro-Ultra-Premium-Debug-APK\` below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hardik-Buds-Pro-Ultra-Premium-Debug-APK
          path: |
            app/build/outputs/apk/debug/Hardik-Buds-Pro-Ultra-Premium-debug.apk
            app/build/outputs/apk/debug/Hardik-Buds-Pro-Ultra-Premium-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish OTA GitHub Release (on v*.*.* version tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          APK_DIR="app/build/outputs/apk/debug"
          TAG_APK="${APK_DIR}/Hardik-Buds-Pro-Ultra-Premium-${TAG_NAME}.apk"
          TAG_SHA="${TAG_APK}.sha256"

          cp "${APK_DIR}/Hardik-Buds-Pro-Ultra-Premium-debug.apk" "$TAG_APK"
          sha256sum "$TAG_APK" > "$TAG_SHA"
          APK_SHA=$(cut -d ' ' -f1 "$TAG_SHA")
          APK_SIZE=$(du -h "$TAG_APK" | cut -f1)

          IS_PRE=""
          if [[ "$TAG_NAME" == *-* ]] || [[ "${{ inputs.is_prerelease }}" == "true" ]]; then
            IS_PRE="--prerelease"
          fi

          NOTES="## HARDIK BUDS PRO — ULTRA PREMIUM (${TAG_NAME})
          
- **Version:** ${TAG_NAME}
- **APK Size:** ${APK_SIZE}
- **SHA-256:** ${APK_SHA}

### What's New
- Built and verified automatically via GitHub Actions
- Verified package ID & SHA-256 integrity for in-app OTA updates"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$TAG_APK" "$TAG_SHA" --clobber
            gh release edit "$TAG_NAME" --title "Hardik Buds Pro ${TAG_NAME}" --notes "$NOTES"
          else
            gh release create "$TAG_NAME" "$TAG_APK" "$TAG_SHA" \
              --title "Hardik Buds Pro ${TAG_NAME}" \
              --notes "$NOTES" \
              $IS_PRE
          fi

      - name: Upload failure reports (if build/test fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
